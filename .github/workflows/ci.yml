name: CI-Payment-Messages

on:
  push:
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: 21

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v5
      
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
  
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
          
      # `verify` = Surefire (H2) puis Failsafe (Testcontainers). Le runner GitHub fournit
      # un démon Docker, les *IT s'exécutent donc réellement ici — c'est le seul endroit où
      # les migrations Flyway sont confrontées à PostgreSQL. Le tir IBM MQ reste hors CI
      # (image ~1 Go) : `./mvnw verify -Dmq.it=true` en local.
      - name: Build & Test with Maven
        run: ./mvnw verify --no-transfer-progress

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  docker-compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate syntax
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Smoke test (start & check)
        run: |
          docker compose -f docker-compose.yaml up -d --wait --wait-timeout 300
          docker compose -f docker-compose.yaml ps

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yaml ps -a
          docker inspect payment-mq --format '{{json .State}}' || true
          docker compose -f docker-compose.yaml logs --no-color --tail 300
          docker run --rm -v payment-messages_mq_data:/d busybox \
            sh -c 'cat /d/data/qmgrs/QM1/errors/autocfgmqsc.LOG' || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yaml down -v
