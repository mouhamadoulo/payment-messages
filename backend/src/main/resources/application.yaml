spring:
  application:
    name: payment-messages

  profiles:
    active: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Doit couvrir la concurrence JMS max + les threads HTTP touchant la base,
      # sans dépasser max_connections côté PostgreSQL.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      leak-detection-threshold: 20000

  # Le schéma est piloté par les migrations (db/migration), pas par Hibernate :
  # migrations relisibles, rejouables et réversibles, sans DDL implicite au démarrage.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # Les bases antérieures à Flyway ont été créées par `ddl-auto: update` ; baseline 0
    # laisse V1 (idempotente) s'appliquer malgré tout, V2 complète ce qui manque.
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      # `validate` : Hibernate contrôle l'accord entité / schéma, il ne le modifie plus.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 50

  cache:
    cache-names: messageStats
    caffeine:
      spec: maximumSize=16,expireAfterWrite=${STATS_CACHE_TTL:15s},recordStats

  jms:
    listener:
      session:
        transacted: true          # explicite : rollback = redélivrance
      min-concurrency: ${MQ_MIN_CONCURRENCY:5}
      max-concurrency: ${MQ_MAX_CONCURRENCY:10}
      receive-timeout: 5s

ibm:
  mq:
    queue-manager: ${MQ_QMGR}
    channel: ${MQ_CHANNEL}
    conn-name: ${MQ_CONN_NAME}
    user: ${MQ_USER}
    password: ${MQ_PASSWORD}
    receive-timeout: 5000
    queue: ${MQ_QUEUE}
    dlq-queue: ${MQ_DLQ_QUEUE}
    max-retries: ${MQ_MAX_RETRIES}
    dlq-recovery:
      enabled: ${MQ_DLQ_RECOVERY_ENABLED:true}
      interval: ${MQ_DLQ_RECOVERY_INTERVAL:60000}
      batch-size: ${MQ_DLQ_RECOVERY_BATCH_SIZE:100}


app:
  # Rejeu massif des messages FAILED : lots bornés, exécutés en tâche de fond.
  batch-retry:
    batch-size: ${BATCH_RETRY_SIZE:500}
    max-messages: ${BATCH_RETRY_MAX:100000}

  # Rétention : purge planifiée des messages PROCESSED. Désactivée par défaut,
  # la suppression étant irréversible (cf. MessageRetentionJob).
  retention:
    enabled: ${RETENTION_ENABLED:false}
    processed-days: ${RETENTION_PROCESSED_DAYS:90}
    batch-size: ${RETENTION_BATCH_SIZE:500}
    max-per-run: ${RETENTION_MAX_PER_RUN:50000}
    cron: ${RETENTION_CRON:0 30 3 * * *}

server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: payment-messages
    version: 1.0.0
    java-version: 21
