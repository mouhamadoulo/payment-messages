spring:
  application:
    name: payment-messages

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_messages?reWriteBatchedInserts=true
    username: payment
    password: payment
    driver-class-name: org.postgresql.Driver

  # Le schéma est dérivé des entités par Hibernate ; `update` le crée et le complète.
  jpa:
    hibernate:
      ddl-auto: update

  jms:
    listener:
      session:
        transacted: true          # explicite : rollback = redélivrance
      min-concurrency: 5
      max-concurrency: 10
      receive-timeout: 5s

ibm:
  mq:
    queue-manager: QM1
    channel: DEV.APP.SVRCONN
    conn-name: localhost(1414)
    user: app
    password: passw0rd
    receive-timeout: 5000
    queue: PAYMENT.REQUEST.QUEUE
    dlq-queue: PAYMENT.DLQ.QUEUE
    max-retries: 3


app:
  cors:
    allowed-origins: http://localhost:4200

  # Simulation d'envoi (onglet « Simulation d'envoi » de l'IHM) : dépose de vrais messages
  # sur la file d'entrée. Laissée active en développement, à couper ailleurs.
  simulation:
    enabled: true
    max-count: 1000
    max-rate: 200

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Développement uniquement : le détail des composants aide au diagnostic local.
      # Le fichier commun le referme (`never`) — ne pas reporter cette valeur en production.
      show-details: always
  # Décommenter pour isoler les endpoints d'exploitation sur un port dédié, à ne pas
  # exposer à l'extérieur.
  # server:
  #   port: 8081

info:
  app:
    name: payment-messages
    version: 1.0.0
    java-version: 21