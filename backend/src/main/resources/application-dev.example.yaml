spring:
  application:
    name: payment-messages

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_messages?reWriteBatchedInserts=true
    username: payment
    password: payment
    driver-class-name: org.postgresql.Driver

  # Le schéma vient des migrations Flyway (db/migration) ; Hibernate ne fait que le vérifier.
  jpa:
    hibernate:
      ddl-auto: validate

  jms:
    listener:
      session:
        transacted: true          # explicite : rollback = redélivrance
      min-concurrency: 5
      max-concurrency: 10
      receive-timeout: 5s

ibm:
  mq:
    queue-manager: QM1
    channel: DEV.APP.SVRCONN
    conn-name: localhost(1414)
    user: app
    password: passw0rd
    receive-timeout: 5000
    queue: PAYMENT.REQUEST.QUEUE
    dlq-queue: PAYMENT.DLQ.QUEUE
    max-retries: 3


app:
  security:
    jwt:
      # Valeur de développement uniquement (32 octets minimum, HS256).
      # En production : secret tiré au hasard, fourni par l'environnement (JWT_SECRET).
      secret: dev-only-secret-change-me-32-bytes-min
      expiration: 1h
    public-docs: true
    allowed-origins: http://localhost:4200
    # Comptes de développement. Le préfixe {noop} indique un mot de passe en clair ;
    # utiliser {bcrypt}$2a$… hors développement.
    users:
      - username: admin
        password: "{noop}admin"
        roles: [ADMIN, USER]
      - username: operator
        password: "{noop}operator"
        roles: [USER]

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  # Décommenter pour isoler les endpoints d'exploitation sur un port dédié. Ils sortent
  # alors de la chaîne de sécurité applicative : ce port ne doit pas être exposé.
  # server:
  #   port: 8081

info:
  app:
    name: payment-messages
    version: 1.0.0
    java-version: 21