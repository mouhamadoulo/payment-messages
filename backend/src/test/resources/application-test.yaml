spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # Les migrations sont écrites pour PostgreSQL ; les tests tournent sur H2 avec un schéma
  # généré par Hibernate à partir des entités (indexes inclus).
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  jms:
    listener:
      session:
        transacted: true
      min-concurrency: 2
      max-concurrency: 4
      auto-startup: false

ibm:
  mq:
    queue-manager: TEST_QM
    channel: TEST_CHANNEL
    conn-name: localhost(1414)
    user: test
    password: test
    receive-timeout: 1000
    queue: TEST.QUEUE
    dlq-queue: TEST.DLQ.QUEUE
    max-retries: 3
    dlq-recovery:
      enabled: false

server:
  port: 0
