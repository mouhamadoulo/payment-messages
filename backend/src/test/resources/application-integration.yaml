# Profil des tests d'intégration (`*IT`), activé en complément de `test` : celui-ci fournit
# déjà la configuration MQ, la sécurité et le port serveur, seule la base change.
#
# Différence de fond avec `test` : la base est un vrai PostgreSQL (Testcontainers). C'est le
# seul contexte où un type de colonne divergent (`timestamptz`), un index partiel ou une
# syntaxe non portable est confronté au moteur réel — H2 les accepte ou les traduit.

spring:
  # url / username / password proviennent du conteneur (@DynamicPropertySource) et priment
  # sur les valeurs du profil `test`.
  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Le conteneur PostgreSQL est un singleton partagé par toutes les classes `*IT` :
      # `update` complète le schéma sans le détruire entre deux contextes.
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
