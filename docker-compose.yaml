services:

  postgres:
    image: postgres:18
    container_name: payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_messages
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_messages"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: payment-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@payment.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  ibm-mq:
    image: icr.io/ibm-messaging/mq:latest
    container_name: payment-mq
    restart: unless-stopped
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_APP_PASSWORD: passw0rd
      MQ_ADMIN_PASSWORD: admin
    ports:
      - "1414:1414"
      - "9443:9443"
    volumes:
      - mq_data:/mnt/mqm
      # Cree PAYMENT.REQUEST.QUEUE et PAYMENT.DLQ.QUEUE au demarrage du QM
      - ./infra/mq/payment-queues.mqsc:/etc/mqm/payment-queues.mqsc:ro
    healthcheck:
      test: ["CMD-SHELL", "chkmqhealthy"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: payment-messages-backend:latest
    container_name: payment-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/payment_messages?reWriteBatchedInserts=true
      DB_USER: payment
      DB_PASSWORD: payment
      JPA_DDL_AUTO: validate   # schéma géré par Flyway (backend/src/main/resources/db/migration)
      DB_POOL_MAX_SIZE: 20
      DB_POOL_MIN_IDLE: 5
      MQ_QMGR: QM1
      MQ_CHANNEL: DEV.APP.SVRCONN
      MQ_CONN_NAME: ibm-mq(1414)
      MQ_USER: app
      MQ_PASSWORD: passw0rd
      MQ_QUEUE: PAYMENT.REQUEST.QUEUE
      MQ_DLQ_QUEUE: PAYMENT.DLQ.QUEUE
      MQ_MAX_RETRIES: 3
      MQ_MIN_CONCURRENCY: 5
      MQ_MAX_CONCURRENCY: 10
      # Sécurité : secret de signature des jetons (32 octets minimum, HS256).
      # Valeur de démonstration — à remplacer par un secret tiré au hasard hors local.
      JWT_SECRET: docker-only-secret-change-me-32-bytes
      JWT_EXPIRATION: 1h
      SECURITY_PUBLIC_DOCS: "true"
      SECURITY_ALLOWED_ORIGINS: http://localhost:4200
      # Comptes de démonstration. Le préfixe {noop} indique un mot de passe en clair.
      APP_SECURITY_USERS_0_USERNAME: admin
      APP_SECURITY_USERS_0_PASSWORD: "{noop}admin"
      APP_SECURITY_USERS_0_ROLES_0: ADMIN
      APP_SECURITY_USERS_0_ROLES_1: USER
      APP_SECURITY_USERS_1_USERNAME: operator
      APP_SECURITY_USERS_1_PASSWORD: "{noop}operator"
      APP_SECURITY_USERS_1_ROLES_0: USER
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ibm-mq:
        condition: service_healthy
    healthcheck:
      # Sonde de disponibilité applicative, et non simple ouverture de socket : le port
      # 8080 écoute bien avant que Flyway, le pool JDBC et le conteneur d'écoute JMS
      # soient prêts. `--fail` fait échouer curl sur un statut HTTP >= 400 (DOWN = 503).
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: payment-messages-frontend:latest
    container_name: payment-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  mq_data:
