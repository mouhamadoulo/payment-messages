<circle cx="56" cy="370" r="4.5" fill="#b0721c"/><text x="70" y="374" font-family="system-ui, sans-serif" font-size="10" fill="#6b7d8f">conteneur d&#233;marr&#233;, sonde encore rouge</text>
<circle cx="56" cy="390" r="4.5" fill="#27794C"/><text x="70" y="394" font-family="system-ui, sans-serif" font-size="10" fill="#6b7d8f">sonde verte : les d&#233;pendants peuvent partir</text>
<text x="52" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#5c6f80">--wait bloque jusqu&#8217;&#224; ce que tout soit vert</text>
