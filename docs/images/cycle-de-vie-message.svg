<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="1160" height="470" role="img" aria-label="Cycle de vie d un message : RECEIVED vers PROCESSED ou FAILED, FAILED rejoue vers RECEIVED puis DEAD_LETTER">
<title>Cycle de vie d un message de paiement</title>
<desc>Le listener pose l etat initial RECEIVED. PUT /status mene a PROCESSED ou FAILED. POST /retry rejoue un FAILED vers RECEIVED tant que retryCount reste sous max-retries, sinon le message part en DEAD_LETTER et son payload est republie sur la file DLQ. PROCESSED et DEAD_LETTER sont terminaux.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#fbfcfe"/><stop offset="1" stop-color="#eaeff5"/></linearGradient>
<pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#4a6b8c" stroke-opacity="0.07" stroke-width="1"/></pattern>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1160" height="470" fill="url(#bg)"/><rect width="1160" height="470" fill="url(#g)"/>

<text x="34" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1a2733">Cycle de vie d&#8217;un message</text>
<text x="34" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" fill="#2F5FA8" letter-spacing="1.4">4 STATUTS &#183; AUCUNE TRANSITION AUTOMATIQUE &#183; GRAPHE APPLIQU&#201; PAR LE SERVEUR</text>

<g font-family="system-ui, sans-serif" font-size="13.5" fill="#41505f">
<text x="34" y="420" opacity="1">Le listener ne pose que l&#8217;&#233;tat initial <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" fill="#2F5FA8">RECEIVED</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.02;0.13;0.16;1" values="1;1;1;0;0"/></text>
<text x="34" y="420" opacity="0"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" fill="#27794C">PUT /{id}/status</tspan> &#8212; toute autre transition r&#233;pond 422<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.16;0.19;0.33;0.36;1" values="0;0;1;1;0;0"/></text>
<text x="34" y="420" opacity="0">Un <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" fill="#B53535">FAILED</tspan> garde son payload brut et reste rejouable<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.36;0.39;0.55;0.58;1" values="0;0;1;1;0;0"/></text>
<text x="34" y="420" opacity="0"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" fill="#B53535">POST /{id}/retry</tspan> &#8212; retryCount + 1, retour en attente<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.58;0.61;0.74;0.77;1" values="0;0;1;1;0;0"/></text>
<text x="34" y="420" opacity="0">Au-del&#224; de <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" fill="#586170">max-retries</tspan> : abandon trac&#233; en DEAD_LETTER<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.77;0.80;0.97;0.995;1" values="0;0;1;1;0;0"/></text>
</g>

<g fill="none" stroke-width="1.8">
<path id="pA" d="M166 230H226" stroke="#64748b" stroke-opacity="0.5"/>
<path id="pB" d="M412 230H518" stroke="#B53535" stroke-opacity="0.45"/>
<path id="pC" d="M519 268C500 336 436 336 417 274" stroke="#2F5FA8" stroke-opacity="0.45"/>
<path id="pD" d="M322 192C360 120 560 86 850 112" stroke="#27794C" stroke-opacity="0.45"/>
<path id="pE" d="M704 200C766 182 806 162 852 148" stroke="#27794C" stroke-opacity="0.3"/>
<path id="pF" d="M704 262C770 292 802 330 850 346" stroke="#586170" stroke-opacity="0.45"/>
</g>
<g>
<polygon points="232,230 222,225 222,235" fill="#64748b"/>
<polygon points="524,230 514,225 514,235" fill="#B53535"/>
<polygon points="414,268 409,278 419,277" fill="#2F5FA8"/>
<polygon points="856,113 846,107 845,117" fill="#27794C"/>
<polygon points="856,146 846,142 847,152" fill="#27794C"/>
