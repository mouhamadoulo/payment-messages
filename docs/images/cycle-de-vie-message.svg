<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" text-anchor="middle">
<text x="196" y="220" fill="#5c6f80">JMS</text>
<text x="466" y="220" fill="#a33a3a">PUT status</text>
<text x="468" y="352" fill="#2F5FA8">POST /retry &#183; retryCount &#8804; max-retries</text>
<text x="560" y="96" fill="#27794C">PUT status &#183; traitement r&#233;ussi</text>
<text x="778" y="176" fill="#3f8a5e" text-anchor="start">r&#233;solution manuelle</text>
<text x="792" y="344" fill="#586170" text-anchor="end">retryCount &gt; max-retries</text>
</g>

<g stroke="#94a3b8" stroke-dasharray="4 4" fill="#ffffff" fill-opacity="0.7">
<rect x="34" y="196" width="132" height="68" rx="10"/>
</g>
<text x="100" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#41505f">IBM MQ</text>
<text x="100" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6b7d8f">file d&#8217;entr&#233;e</text>

<g>
<rect x="224" y="184" width="196" height="92" rx="16" fill="none" stroke="#2F5FA8" stroke-width="2" filter="url(#soft)" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.08;0.12;0.20;0.66;0.72;0.78;1" values="0;0;0.85;0;0;0.85;0;0"/></rect>
<rect x="232" y="192" width="180" height="76" rx="12" fill="#E9F0FA" stroke="#2F5FA8" stroke-opacity="0.45"/>
<text x="322" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#2F5FA8">RECEIVED</text>
<text x="322" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a6274">persist&#233;, en attente</text>
<text x="322" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7d8f">&#233;tat initial</text>
</g>

<g>
<rect x="516" y="184" width="196" height="92" rx="16" fill="none" stroke="#B53535" stroke-width="2" filter="url(#soft)" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.30;0.36;0.44;0.74;0.80;0.86;1" values="0;0;0.85;0;0;0.85;0;0"/></rect>
<rect x="524" y="192" width="180" height="76" rx="12" fill="#F8E6E6" stroke="#B53535" stroke-opacity="0.45"/>
<text x="614" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#B53535">FAILED</text>
<text x="614" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#7a4141">payload brut + motif</text>
<text x="614" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#a3706f">rejouable</text>
</g>

<g>
<rect x="848" y="70" width="230" height="92" rx="16" fill="none" stroke="#27794C" stroke-width="2" filter="url(#soft)" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.24;0.30;0.38;1" values="0;0;0.9;0;0"/></rect>
<rect x="856" y="78" width="214" height="76" rx="12" fill="#E2F2E8" stroke="#27794C" stroke-opacity="0.45"/>
<text x="963" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#27794C">PROCESSED</text>
<text x="963" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#3d6650">trait&#233; avec succ&#232;s</text>
<text x="963" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#5d8a71">&#233;tat terminal</text>
</g>

<g>
<rect x="848" y="304" width="230" height="92" rx="16" fill="none" stroke="#586170" stroke-width="2" filter="url(#soft)" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.86;0.90;0.98;1" values="0;0;0.9;0;0"/></rect>
<rect x="856" y="312" width="214" height="76" rx="12" fill="#ECEFF2" stroke="#586170" stroke-opacity="0.45"/>
<text x="963" y="342" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#586170">DEAD_LETTER</text>
<text x="963" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#4f5967">abandon trac&#233;</text>
<text x="963" y="378" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7480">&#233;tat terminal</text>
<text x="963" y="410" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#7c6a4d">payload republi&#233; sur la DLQ apr&#232;s commit</text>
</g>

