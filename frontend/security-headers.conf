# En-tetes de securite communs a toutes les reponses servies par nginx.
#
# Fichier separe et `include` dans chaque bloc `location` : `add_header` n'est pas
# cumulatif en nginx. Des qu'un `location` declare son propre `add_header`, il
# **remplace** l'integralite des en-tetes herites du bloc `server` — un
# `Cache-Control` ajoute sur les assets suffirait donc a faire disparaitre toute
# la politique de securite sur ces reponses. D'ou l'include repete.
#
# `always` : l'en-tete est aussi emis sur les reponses d'erreur (401, 404, 5xx),
# ou `add_header` reste muet par defaut.

# CSP.
# - `script-src 'self'` strict : possible parce que `inlineCritical` est desactive
#   dans angular.json — l'optimisation inserait un `<link ... onload="...">`, soit
#   un gestionnaire d'evenement en ligne, qui aurait impose `'unsafe-inline'`.
# - `style-src` garde `'unsafe-inline'` : Angular injecte les styles de composants
#   sous forme de balises `<style>` au runtime, et index.html porte le style du
#   splash. Un nonce imposerait de reecrire index.html a chaque requete.
# - `font-src` : les @font-face IBM Plex sont inlines au build mais les fichiers
#   .woff2 sont toujours telecharges depuis fonts.gstatic.com.
# - `connect-src 'self'` : l'API passe par /api/ sur la meme origine (proxy nginx).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;

# Doublon volontaire de `frame-ancestors` pour les navigateurs qui ignorent la CSP.
add_header X-Frame-Options "DENY" always;

# L'origine est envoyee en cross-origin, jamais le chemin complet (les URL de
# detail portent des identifiants de messages).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Aucune API materielle n'est utilisee par l'application.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Pas de `Strict-Transport-Security` ici : le conteneur sert en clair sur le port
# 80 et la terminaison TLS se fait en amont. HSTS doit etre pose par ce terminaison,
# sinon l'en-tete est ignore (il n'a d'effet que sur une reponse HTTPS).
