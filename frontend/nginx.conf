server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas divulguer la version de nginx dans les en-tetes et les pages d'erreur.
    server_tokens off;

    # Compression a la volee : filet de securite pour ce que le build n'a pas
    # precompresse (reponses du proxy /api/ notamment).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml;

    # Sert les .gz generes au build (cf. Dockerfile) au lieu de recompresser a
    # chaque requete : meme octets, cout CPU nul, et niveau de compression 9
    # inatteignable a la volee.
    gzip_static on;

    # index.html ne doit jamais etre mis en cache : il est le seul fichier non
    # hache, et un exemplaire perime pointerait vers des bundles supprimes au
    # deploiement suivant (page blanche jusqu'au vidage du cache navigateur).
    # `try_files ... /index.html` provoque une redirection interne qui repasse
    # par ce bloc, donc le fallback SPA est couvert lui aussi.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Bundles haches (outputHashing: all) : le nom change a chaque contenu, donc
    # cache d'un an immuable. La regex est entre guillemets : nginx exige qu'une
    # directive contenant `{` soit citee.
    location ~* "-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Assets non haches (contenu de public/ : favicon...) : leur nom est stable,
    # `immutable` y figerait une version pour un an. Cache court avec revalidation.
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # DNS interne Docker : resolution a la volee pour que nginx demarre
    # meme si le service backend n'est pas encore up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API -> backend Spring Boot (remplace proxy.conf.json du dev-server)
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (routes Angular)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
